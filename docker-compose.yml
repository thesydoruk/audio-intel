name: audio-intel

# Runs the released image from GHCR. To build from this checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  audio-intel:
    image: ghcr.io/thesydoruk/audio-intel:${AUDIO_INTEL_VERSION:-2.0.1}
    env_file:
      - path: .env
        required: false
    ports:
      - "${AUDIO_INTEL_PORT:-8080}:${AUDIO_INTEL_PORT:-8080}"
    volumes:
      - ${MODEL_CACHE_HOST_DIR:-./data/whisper}:/var/lib/whisper
      - ${PANNS_CACHE_HOST_DIR:-./data/panns}:/root/panns_data
    environment:
      AUDIO_INTEL_PORT: ${AUDIO_INTEL_PORT:-8080}
      MODEL_CACHE_DIR: /var/lib/whisper
      HF_HOME: /var/lib/whisper
      HF_HUB_DISABLE_XET: "1"
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: float16
      SOUND_EVENTS_DEVICE: cuda
      SPEAKERS_DEVICE: cuda
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$$AUDIO_INTEL_PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 80
      # First start downloads Whisper weights (~3 GB for large-v3) before /health answers.
      start_period: 1800s

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-intel"
version = "2.1.0"
description = "Audio intelligence: Whisper transcription, CTC alignment, diarization, and sound-event detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Valerii Sydoruk" }]
keywords = [
    "asr",
    "whisper",
    "transcription",
    "diarization",
    "audio",
    "speech-recognition",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "faster-whisper>=1.2.0",
    # 4.6.3 is the first release built for CUDA 12.8, which Blackwell (RTX 50xx)
    # needs; cuDNN 9 as before.
    "ctranslate2>=4.6.3,<5",
    "numpy>=1.24",
    "soundfile>=0.12",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "torchlibrosa>=0.1.0",
    "librosa>=0.10",
    "panns-inference>=0.1.1",
    # transformers (whisperx alignment) still requires hub < 1.0.
    "huggingface-hub>=0.28.1,<1.0.0",
    "pyannote.audio==4.0.7",
    # Legacy checkpoints (pyannote/embedding) pickle omegaconf objects; 4.x dropped the dep.
    "omegaconf>=2.1,<3",
]
# whisperx pins pyannote.audio < 4, which conflicts with the server extra; the
# Dockerfile installs it with --no-deps (its alignment code never imports pyannote).
align = ["whisperx>=3.3.0"]
vad = ["silero-vad>=5.1"]
# Speaker separation (audio-intel separate): the pure-Python part runs the stub
# backends and the tests; `separate` adds the models (Demucs, SpeechBrain
# SepFormer / ECAPA). ClearerVoice enhancement is a further opt-in.
separate-core = ["scipy>=1.11", "soxr>=0.3.7", "pyyaml>=6.0", "tqdm>=4.66", "rich>=13.7"]
separate = ["audio-intel[separate-core]", "demucs>=4.0.1", "speechbrain>=1.0", "safetensors>=0.4"]
clearvoice = ["clearvoice"]
all = ["audio-intel[server,vad,separate]"]
# ruff matches .pre-commit-config.yaml so CI and the hook format identically.
dev = ["audio-intel[separate-core]", "pytest>=8.0", "ruff==0.11.13", "pre-commit>=4.0"]

[project.urls]
Homepage = "https://github.com/thesydoruk/audio-intel"
Repository = "https://github.com/thesydoruk/audio-intel"
Issues = "https://github.com/thesydoruk/audio-intel/issues"

[project.scripts]
audio-intel = "audio_intel.server.__main__:main"

[tool.setuptools.package-dir]
"audio_intel" = "src"

[tool.setuptools]
packages = [
    "audio_intel",
    "audio_intel.align",
    "audio_intel.audio",
    "audio_intel.common",
    "audio_intel.diarization",
    "audio_intel.events",
    "audio_intel.quality",
    "audio_intel.server",
    "audio_intel.transcribe",
    "audio_intel.vad",
    "audio_intel.separate",
    "audio_intel.separate.audio",
    "audio_intel.separate.cache",
    "audio_intel.separate.embeddings",
    "audio_intel.separate.evaluation",
    "audio_intel.separate.models",
    "audio_intel.separate.models.diarization",
    "audio_intel.separate.models.embeddings",
    "audio_intel.separate.models.enhancement",
    "audio_intel.separate.models.overlap",
    "audio_intel.separate.models.separation",
    "audio_intel.separate.models.super_resolution",
    "audio_intel.separate.models.tse",
    "audio_intel.separate.pipeline",
    "audio_intel.separate.report",
    "audio_intel.separate.stitching",
    "audio_intel.separate.tracking",
]

[tool.setuptools.package-data]
"audio_intel.separate" = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mdformat]
wrap = 100

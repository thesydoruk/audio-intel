name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to rebuild"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: Tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: check
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "${VER}" ]; then
            echo "Tag ${TAG} does not match pyproject version ${VER}"
            exit 1
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  image:
    name: Build, smoke, push
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: audio-intel:release
      # Nothing is published unless the image imports its native stack and passes tests.
      - name: Smoke
        run: bash scripts/image-smoke.sh audio-intel:release
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          for tag in "${VERSION}" latest; do
            docker tag audio-intel:release "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Publish the release only after the image exists, so its notes never point
    # at a tag that cannot be pulled.
    needs: [guard, image]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: ${{ needs.guard.outputs.tag }}
          generate_release_notes: true
          body: |
            Image: `ghcr.io/${{ github.repository }}:${{ needs.guard.outputs.version }}`
